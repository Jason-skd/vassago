# --- vassago:meta ---
# config_kind = "collection_rd_profile"
# config_id = "rd_phase1_default"
# label = "RD Phase 1 Default"
# description = "Default RD collection profile for the current UART-first workflow."
# lifecycle = "active"
# ---
schema_version = "collection_rd_profile_v2"
batch_size = 12

[global]
config_id = "rd_global_default"

[firmware]
config_id = "rd_candidate"

[defaults]
hand = "right"
distance_m = 0.5
angle_deg = 0.0
environment = "office_lab"
radar_id = "rd_aop_01"
firmware_id = "rd_phase1_uart"

[options]
gestures = ["swipe_left", "swipe_right", "push", "pull"]
environments = ["office_lab", "meeting_room", "hallway"]

[gesture_target_durations]
swipe_left = 1.6
swipe_right = 1.6
push = 1.8
pull = 1.8
