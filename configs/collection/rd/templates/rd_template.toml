# --- vassago:meta ---
# config_kind = "collection_rd_profile"
# config_id = "rd_profile_template"
# label = "RD Profile Template"
# description = "Template for authoring RD collection round profiles."
# lifecycle = "template"
# ---
schema_version = "collection_rd_profile_v2"
batch_size = 12

[global]
config_id = "rd_global_default"

[firmware]
default_config_id = "rd_candidate"

# Optional overrides for repository-level defaults.
# capture_window_duration_s = 5.0
# countdown_duration_s = 5.0
# marked_window_end_grace_s = 0.30
# end_mark_key = "space"

# Optional serial overrides.
# [serial]
# cli_baudrate = 115200
# data_baudrate = 921600

[defaults]
hand = "right"
distance_m = 0.5
angle_deg = 0.0
environment = "office_lab"
radar_id = "rd_aop_01"
firmware_id = "rd_phase1_uart"

[options]
gestures = ["swipe_left", "swipe_right", "push", "pull"]
environments = ["office_lab", "meeting_room", "hallway"]

[gesture_target_durations]
swipe_left = 1.6
swipe_right = 1.6
push = 1.8
pull = 1.8
