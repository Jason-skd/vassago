pre-commit:
  commands:
    format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    config-check:
      run: uv run python -m vassago.configs.validation

    typecheck:
      glob: "*.py"
      run: uv run pyright

    test:
      glob: "*.py"
      run: uv run pytest --testmon || [ $? -eq 5 ]  # 5 是 pytest 在没有测试文件时返回的退出代码

    code-stats:
      run: scc --ci src scripts docs
