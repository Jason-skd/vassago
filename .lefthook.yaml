min_version: 1.10.0

pre-commit:
  piped: true
  jobs:
    - name: staged-mutators
      group:
        piped: true
        jobs:
          - name: python-autofix
            glob: "*.py"
            group:
              piped: true
              jobs:
                - name: format
                  run: uv run ruff format {staged_files}
                  stage_fixed: true
                - name: lint
                  run: uv run ruff check --fix {staged_files}
                  stage_fixed: true

          - name: config-check
            run: uv run vassago configs validate
            stage_fixed: true

    - name: read-only-checks
      group:
        parallel: true
        jobs:
          - name: collection-offline-qc
            run: uv run vassago collection rd offline-qc-all

          - name: typecheck
            glob: "*.py"
            run: uv run pyright

          - name: test
            glob: "*.py"
            run: uv run pytest --testmon || [ $? -eq 5 ]  # 5 是 pytest 在没有测试文件时返回的退出代码

          - name: code-stats
            run: command -v scc >/dev/null 2>&1 && scc --ci src docs || true
